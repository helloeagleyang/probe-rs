name: HPM6300 Series
variants:
- name: HPM6360xPAx
  package_variants:
  - HPM6360
  cores:
  - name: core0
    type: riscv
    core_access_options: !Riscv
      hart_id: 0
  memory_map:
  - !Ram
    name: ILM0
    range:
      start: 0x0
      end: 0x20000
    cores:
    - core0
  - !Ram
    name: DLM0
    range:
      start: 0x80000
      end: 0xa0000
    cores:
    - core0
  - !Ram
    name: XRAM0
    range:
      start: 0x1080000
      end: 0x1100000
    cores:
    - core0
  - !Nvm
    name: XPI0
    range:
      start: 0x80000000
      end: 0x82000000
    cores:
    - core0
    access:
      boot: true
  - !Nvm
    name: XPI1
    range:
      start: 0x90000000
      end: 0x92000000
    cores:
    - core0
  - !Ram
    name: HRAM
    range:
      start: 0xf0300000
      end: 0xf0308000
    cores:
    - core0
  flash_algorithms:
  - hpm-xpi0-f304-opt5-32mb
  - hpm-xpi1-f3044000-opt5-32mb
