name: HPM5E00 Series
variants:
- name: HPM5E31xGNx
  package_variants:
  - HPM5E31
  cores:
  - name: core0
    type: riscv
    core_access_options: !Riscv
      hart_id: 0
  memory_map:
  - !Ram
    name: CPU0_ILM
    range:
      start: 0x0
      end: 0x20000
    cores:
    - core0
  - !Ram
    name: CPU0_DLM
    range:
      start: 0x200000
      end: 0x220000
    cores:
    - core0
  - !Ram
    name: XRAM0
    range:
      start: 0x1200000
      end: 0x1240000
    cores:
    - core0
  - !Nvm
    name: XPI0
    range:
      start: 0x80000000
      end: 0x80100000
    cores:
    - core0
    access:
      boot: true
  - !Nvm
    name: HYBRID_XPI0
    range:
      start: 0xb0000000
      end: 0xb0100000
    cores:
    - core0
  - !Ram
    name: HRAM
    range:
      start: 0xf0200000
      end: 0xf0208000
    cores:
    - core0
  flash_algorithms:
  - flash-algo-hpm-xpi0-f300-1mb
  - hpm-hybrid-f300-opt5-1000-1mb
