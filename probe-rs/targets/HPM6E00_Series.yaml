variants:
- name: HPM6E80xVMx
  package_variants:
  - HPM6E80
  cores:
  - name: core0
    type: riscv
    core_access_options: !Riscv
      hart_id: 0
  - name: core1
    type: riscv
    core_access_options: !Riscv
      hart_id: 1
  memory_map:
  - !Ram
    name: ILM0
    range:
      start: 0x0
      end: 0x40000
    cores:
    - core0
  - !Ram
    name: CPU1_ILM
    range:
      start: 0x40000
      end: 0x80000
    cores:
    - core1
  - !Ram
    name: DLM0
    range:
      start: 0x200000
      end: 0x240000
    cores:
    - core0
  - !Ram
    name: CPU1_DLM
    range:
      start: 0x240000
      end: 0x280000
    cores:
    - core1
  - !Ram
    name: XRAM0
    range:
      start: 0x1200000
      end: 0x1280000
    cores:
    - core0
    - core1
  - !Ram
    name: XRAM1
    range:
      start: 0x1280000
      end: 0x1300000
    cores:
    - core0
    - core1
  - !Nvm
    name: XPI0
    range:
      start: 0x80000000
      end: 0x82000000
    cores:
    - core0
    - core1
    access:
      boot: true
  - !Ram
    name: HRAM
    range:
      start: 0xf0200000
      end: 0xf0208000
    cores:
    - core0
    - core1
  flash_algorithms:
  - hpm-xpi0-f300-opt5-32mb
