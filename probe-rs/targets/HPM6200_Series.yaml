flash_algorithms:
- name: hpm-xpi0-f304-opt5-32mb
  description: HPM XPI0 NOR (XPI 0xF3040000, opt0 0x5)
  default: true
  instructions: 
  load_address: 0x20
  pc_init: 0x32c
  pc_uninit: 0x340
  pc_program_page: 0x350
  pc_erase_sector: 0x342
  pc_erase_all: 0x35e
  data_section_offset: 0x4b4
  flash_properties:
    address_range:
      start: 0x80000000
      end: 0x82000000
    page_size: 0x100
    erased_byte_value: 0xff
    program_page_timeout: 1000
    erase_sector_timeout: 2000
    sectors:
    - size: 0x1000
      address: 0x0
  cores:
  - core0
  stack_size: 2048
