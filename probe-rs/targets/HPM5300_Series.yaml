flash_algorithms:
- name: flash-algo-hpm53x1
  description: HPM XPI0 NOR (1MB SiP, opt0 0x5, opt1 0x1000)
  default: true
  instructions: 
  load_address: 0x20
  pc_init: 0x70
  pc_uninit: 0x194
  pc_program_page: 0x14a
  pc_erase_sector: 0x34
  pc_erase_all: 0x0
  data_section_offset: 0x4dc
  flash_properties:
    address_range:
      start: 0x80000000
      end: 0x80100000
    page_size: 0x100
    erased_byte_value: 0xff
    program_page_timeout: 1000
    erase_sector_timeout: 2000
    sectors:
    - size: 0x1000
      address: 0x0
  cores:
  - core0
  stack_size: 2048
