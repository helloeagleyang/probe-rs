  package_variants:
  - HPM5361xCBx
  - HPM5361xCFx
  - HPM5361xEGx
  cores:
  - name: core0
    type: riscv
    core_access_options: !Riscv
  memory_map:
  - !Ram
    name: ILM0
    range:
      start: 0x0
      end: 0x20000
    cores:
    - core0
  - !Ram
    name: DLM0
    range:
      start: 0x80000
