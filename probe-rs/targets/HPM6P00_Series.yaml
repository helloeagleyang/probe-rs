name: HPM6P00 Series
variants:
- name: HPM6P81xRTx
  package_variants:
  - HPM6P81
  cores:
  - name: core0
    type: riscv
    core_access_options: !Riscv
      hart_id: 0
  - name: core1
    type: riscv
    core_access_options: !Riscv
      hart_id: 1
  memory_map:
  - !Ram
    name: ILM0
    range:
      start: 0x0
      end: 0x20000
    cores:
    - core0
  - !Ram
    name: CPU1_ILM
    range:
      start: 0x40000
      end: 0x60000
    cores:
    - core1
  - !Ram
    name: DLM0
    range:
      start: 0x200000
      end: 0x220000
    cores:
    - core0
  - !Ram
    name: CPU1_DLM
    range:
      start: 0x240000
      end: 0x260000
    cores:
    - core1
  - !Ram
    name: XRAM0
    range:
      start: 0x1200000
      end: 0x1240000
    cores:
    - core0
    - core1
  - !Nvm
    name: XPI0
    range:
      start: 0x80000000
      end: 0x80100000
    cores:
    - core0
    - core1
    access:
      boot: true
  - !Ram
    name: HRAM
    range:
      start: 0xf0200000
      end: 0xf0208000
    cores:
    - core0
    - core1
  flash_algorithms:
  - flash-algo-hpm-xpi0-f300-1mb
