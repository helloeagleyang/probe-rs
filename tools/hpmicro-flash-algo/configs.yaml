# HPM XPI NOR flash algorithm configurations.
#
# flash_base/device_size describe the probe-rs flash window and the CMSIS
# FlashDevice descriptor. xpi_base/opt0/opt1/header are passed to the HPM ROM
# API. header is 0xFCF90001 for two-argument configs and 0xFCF90002 for
# three-argument configs.
- name: hpm-xpi0-f304-opt5-e-32mb
  flash_base: 0x80000000
  device_size: 0x2000000
  xpi_base: 0xF3040000
  header: 0xFCF90002
  opt0: 0x5
  opt1: 0xE
  description: HPM XPI0 NOR (XPI 0xF3040000, opt0 0x5, opt1 0xE)

